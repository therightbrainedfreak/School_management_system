<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: monospace;
        }
        #main_nav {
            display: flex;
            flex-direction: row;
            font-size: 2rem;
            padding: 12px;
            gap: 18px;
        }
        #main_nav form input {
            padding: 4px 8px;
        }
    </style>
</head>
<body>
    <nav id="main_nav">
        <span>THISANDTHAT</span>
        <form action="#" id="myForm">
            <input id="appRef" placeholder="application reference" autocomplete="on" type="text" maxlength="10" required>
            <input type="submit">
        </form>
    </nav>
    <div id="container"></div>
    <script>
        const form = document.getElementById("myForm");
        const app_ref = document.getElementById("appRef");
        const main_c = document.getElementById("container");

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const response = await fetchApplication(app_ref.value);
            const application_r = response.data["application"];
            main_c.innerHTML = JSON.stringify(application_r)
        })

        async function fetchApplication(application_reference) {
            try {
                const path = "/api/v1/applications"
                const uri = "http://localhost:3300"
                const url = uri+path+"/"+application_reference
                const r = await fetch(url, {
                    method: "GET"
                })
                const response = await r.json();;
                return response;
            } catch (error) {
                console.error(error);
            }
        };
    </script>
</body>
</html>
